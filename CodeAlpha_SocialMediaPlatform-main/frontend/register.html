<!DOCTYPE html>
<html>

<head>

<title>
Register - CodeAlpha Social
</title>


<link rel="stylesheet" href="style.css">


</head>



<body class="auth-body">



<div class="auth-card">


<h1>
📱 CodeAlpha Social
</h1>


<h2>
Create Account
</h2>




<form onsubmit="register(event)">



<input

type="text"

id="username"

placeholder="Enter Username"

required>



<input

type="email"

id="email"

placeholder="Enter Email"

required>



<input

type="password"

id="password"

placeholder="Enter Password"

required>



<button class="auth-btn">

Register

</button>



</form>




<p>

Already have an account?

<a href="login.html">
Login
</a>


</p>



</div>




<script src="register.js"></script>


</body>

</html>
